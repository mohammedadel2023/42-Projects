[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Building a full RAG system (indexer -> Retrival -> answer generation)"
readme = "README.md"
authors = [
    { name = "mohammedadel2023", email = "mohammedkhashan2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.11",
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "llama-cpp-python>=0.3.35",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
    "transformers>=5.17.0",
    "types-tqdm>=4.70.0.20260906",
]

[project.scripts]
rag-against-the-machine = "rag_against_the_machine:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
[[tool.mypy.overrides]]
module = ["bm25s.*", "fire.*"]
explicit_package_bases = true

ignore_missing_imports = true

[tool.setuptools.package-data]
rag_against_the_machine = ["py.typed"]

