[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [
  {name = "mkhashan", email = "mohammedkhashan2005@gmail.com"},
  {name = "klafi", email = "shockrobot@gmail.com"}
]
description = "A utility package for mazegen, path finding and maze visualization."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mlx>=2.2"
]
[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "mlx",
    "mlx.*"
]
ignore_missing_imports = true